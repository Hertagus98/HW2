<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ETF Backtester</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script></head>
<body><main class="shell"><header><div><span class="eyebrow">PORTFOLIO ANALYTICS</span><h1>ETF <span>Backtester</span></h1><p>과거 조정 종가로 적립식 투자 전략을 검증하세요.</p></div><div class="status"><i></i> LIVE DATA</div></header>
<section class="layout"><aside class="panel"><h2>투자 조건</h2><label>ETF 선택 <small>최대 6개</small></label><div id="ticker-list" class="tickers"></div><div class="field"><label for="initial">초기 투자금 <small>KRW</small></label><input id="initial" type="number" value="10000000" min="1" step="100000"></div><div class="field"><label for="monthly">월 적립금 <small>KRW</small></label><input id="monthly" type="number" value="500000" min="0" step="10000"></div><div class="dates"><div><label for="start">시작일</label><input id="start" type="date" value="2015-01-01"></div><div><label for="end">종료일</label><input id="end" type="date"></div></div><button id="run">백테스트 실행 <b>→</b></button><p class="hint">※ 조정 종가(배당·분할 반영), 월별 첫 거래일 매수</p></aside>
<section class="content"><div id="message" class="message hidden"></div><div class="chart-card"><div class="card-head"><div><h2>자산 추이</h2><p id="subtitle">조건을 입력하고 백테스트를 실행하세요.</p></div><div id="legend" class="legend"></div></div><div id="chart" class="chart"></div></div><div id="metrics" class="metrics"></div><div class="note"><b>계산 방법</b><span>투자금은 시작일에 투자하고 이후 매월 해당 월의 첫 거래일에 적립합니다. Yahoo Finance의 Adj Close를 사용하므로 배당과 분할이 반영된 가격 흐름을 사용합니다. ETF 상장 전 구간은 임의로 보완하지 않습니다.</span></div></section></section></main><script src="/static/app.js"></script></body></html>
