name: Build and publish Docker image

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: randomxssmemory/etf-backtester

concurrency:
  group: etf-backtester-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run calculation tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest==8.3.4
      - name: Test cash-flow metrics
        run: python -m pytest -q tests/test_metrics.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, windows, x64]
    permissions:
      contents: read
    steps:
      - name: Check out repository for monitoring
        uses: actions/checkout@v4
      - name: Start pre-deploy and post-deploy monitor
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path monitoring | Out-Null
          $script = Join-Path $env:GITHUB_WORKSPACE 'scripts/monitor.ps1'
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"{0}"' -f $script), '-OutputPath', 'monitoring/requests.csv', '-StopPath', 'monitoring/stop', '-DurationSeconds', '1800', '-IntervalSeconds', '1')
          $monitor = Start-Process powershell -ArgumentList $arguments -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -PassThru -RedirectStandardOutput 'monitoring/stdout.log' -RedirectStandardError 'monitoring/stderr.log'
          $monitor.Id | Set-Content 'monitoring/process.pid'
          for ($attempt = 0; $attempt -lt 15; $attempt++) {
            if (Test-Path 'monitoring/requests.csv') { break }
            $monitor.Refresh()
            if ($monitor.HasExited) {
              Get-Content 'monitoring/stderr.log'
              throw 'Monitor exited before recording a sample.'
            }
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path 'monitoring/requests.csv')) { throw 'Monitor did not create requests.csv.' }
      - name: Log in to Docker Hub for deployment
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Deploy commit image on Windows runner
        shell: powershell
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          CONTAINER_NAME: etf-backtester
        run: |
          $ErrorActionPreference = 'Stop'
          $IMAGE = $env:IMAGE
          $CONTAINER_NAME = $env:CONTAINER_NAME
          docker pull $IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Docker image pull failed.' }

          $existing = docker ps -aq --filter "name=^$CONTAINER_NAME$"
          if ($existing) {
            docker stop $CONTAINER_NAME 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'Stopping the existing container failed.' }
            docker rm $CONTAINER_NAME 2>$null
            if ($LASTEXITCODE -ne 0) { throw 'Removing the existing container failed.' }
          }

          docker run -d --name $CONTAINER_NAME --restart unless-stopped -p 127.0.0.1:8000:8000 $IMAGE
          if ($LASTEXITCODE -ne 0) { throw 'Starting the new container failed.' }

          $healthy = $false
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri 'http://127.0.0.1:8000/api/etfs' -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 2
            }
          }
          if (-not $healthy) {
            docker logs $CONTAINER_NAME
            throw 'ETF Backtester health check failed.'
          }

          Invoke-WebRequest -Uri 'http://127.0.0.1:8000/' -UseBasicParsing -TimeoutSec 10 | Out-Null
          docker ps --filter "name=^$CONTAINER_NAME$"
          Start-Sleep -Seconds 32
      - name: Publish monitoring results
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path monitoring | Out-Null
          New-Item -ItemType File -Force -Path 'monitoring/stop' | Out-Null
          if (Test-Path 'monitoring/process.pid') {
            $monitorProcessId = [int](Get-Content 'monitoring/process.pid')
            Wait-Process -Id $monitorProcessId -Timeout 10 -ErrorAction SilentlyContinue
          }
          $log = 'monitoring/requests.csv'
          '## Deployment monitoring' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if (-not (Test-Path $log)) {
            'Monitoring failed to produce requests.csv. See monitoring stderr artifact.' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            throw 'Monitoring results are missing.'
          }
          $rows = @(Import-Csv $log)
          $total = $rows.Count
          if ($total -eq 0) { throw 'Monitoring CSV contains no samples.' }
          $success = @($rows | Where-Object { $_.status_code -eq '200' }).Count
          $failed = $total - $success
          $latencies = @($rows | ForEach-Object { [double]::Parse($_.latency_ms, [cultureinfo]::InvariantCulture) })
          $avg = [math]::Round(($latencies | Measure-Object -Average).Average, 2)
          $versions = ($rows.service_version | Where-Object { $_ } | Select-Object -Unique) -join ', '
          $observation = if ($failed -gt 0) { 'Failed requests were observed during this deployment.' } else { 'No failed requests observed in sampled requests. Gaps between samples are not verified.' }
          @("- Service: http://127.0.0.1:8000", "- Commit: $env:GITHUB_SHA", "- Samples: $total", "- HTTP 200: $success", "- Failed/unavailable: $failed", "- Average latency (ms): $avg", "- Observed versions: $versions", "- First sample (UTC): $($rows[0].timestamp_utc)", "- Last sample (UTC): $($rows[-1].timestamp_utc)", "- Observation: $observation", "- Window: before deployment through at least 30 seconds after a successful health check.") | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload monitoring artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etf-backtester-monitor-${{ github.sha }}
          path: monitoring/
          if-no-files-found: error
